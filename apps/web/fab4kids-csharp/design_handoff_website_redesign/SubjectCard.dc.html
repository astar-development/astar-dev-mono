<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<![CDATA[<a href="{{ href }}" style="display: block; background: #FFF; border: 2px solid #F3E9D6; border-radius: 20px; padding: 24px 20px; text-align: center; height: 100%; box-sizing: border-box;" style-hover="transform: translateY(-6px); box-shadow: 0 10px 0 #F3E9D6;">

  <h3 style="font-family: 'Fredoka', sans-serif; font-size: 18px; font-weight: 600; margin: 0 0 8px; color: #2B2420;">{{ label }}</h3>
  <p style="font-size: 13px; color: #8A8072; margin: 0;">{{ desc }}</p>
</a>]]>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:220,&quot;height&quot;:220},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Maths&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;letter&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;M&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3B8FE0&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;desc&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Number, algebra, geometry &amp; problem-solving.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Maths.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
