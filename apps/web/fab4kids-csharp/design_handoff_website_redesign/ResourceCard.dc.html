<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<![CDATA[<a href="Resource.dc.html" style="display: flex; flex-direction: column; background: #FFF; border-radius: 20px; overflow: hidden; border: 2px solid #F3E9D6; height: 100%; box-sizing: border-box;" style-hover="transform: translateY(-6px); box-shadow: 0 10px 0 #F3E9D6;">
  <div style="position: relative; background: #FFFBF2;">
    <image-slot id="resource-{{ item.title }}" shape="rect" placeholder="Resource cover / preview page" style="width: 100%; height: 150px;"></image-slot>
    <div style="position: absolute; top: 10px; left: 10px; background: {{ item.subjectColor }}; color: #FFF; font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.03em;">{{ item.subject }}</div>
    <div style="position: absolute; top: 10px; right: 10px; background: #2B2420; color: #FFF; font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 999px;">{{ item.format }}</div>
  </div>
  <div style="padding: 16px; display: flex; flex-direction: column; gap: 8px; flex: 1;">
    <h3 style="font-family: 'Fredoka', sans-serif; font-size: 16px; font-weight: 600; margin: 0; color: #2B2420;">{{ item.title }}</h3>
    <div style="font-size: 12px; color: #8A8072; font-weight: 700;">{{ item.stage }}</div>
    <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between;">
      <span style="font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 17px; color: #2B2420;">{{ item.price }}</span>
      <span style="background: #FFC93C; color: #2B2420; font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 12px;">Add +</span>
    </div>
  </div>
</a>]]>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:340},&quot;item&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{title:string,subject:string,subjectColor:string,format:string,stage:string,price:string}&quot;}}"></script>
</body>
</html>
