name: SonarCloud

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/**/*.cs'
      - 'apps/**/*.csproj'
      - 'apps/**/*.axaml'
      - 'apps/**/*.razor'
      - 'packages/**/*.cs'
      - 'packages/**/*.csproj'
      - 'tests/**/*.cs'
      - 'tests/**/*.csproj'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.Config'
      - '*.slnx'
      - '.github/workflows/sonarcloud.yml'
  # No paths filter: "Build and analyze" is a required check, and a required
  # check that a filter skips never reports, which blocks the PR forever.
  # The `changes` job skips the build via a job-level `if` instead: a job
  # skipped that way reports as skipped, which satisfies the required check.
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip
  SONAR_PROJECT_KEY: 'astar-development_astar-dev-mono'
  SONAR_ORG: 'astar-development'

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Keep this pattern in step with the push `paths:` list above.
      # Non-PR events always analyze (the push trigger is already path-filtered).
      - name: Filter changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          PATTERN='^(apps|packages|tests)/.*\.(cs|csproj|axaml|razor)$|^(Directory\.Build\.props|Directory\.Build\.targets|Directory\.Packages\.props|global\.json|NuGet\.Config)$|^[^/]*\.slnx$|^\.github/workflows/sonarcloud\.yml$|^\.github/scripts/'
          if [ "$EVENT_NAME" != "pull_request" ] || git diff --name-only "$BASE_SHA" HEAD | grep -Eq "$PATTERN"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "No code changes - skipping analysis"
          fi

  build-and-analyze:
    name: Build and analyze
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK
        uses: actions/setup-java@v4.4.0
        with:
          java-version: 25
          distribution: 'zulu'

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: 🛠 Cache SonarQube Cloud packages
        uses: actions/cache@v4.2.3
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: 🛠 Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4.2.3
        with:
          path: ./.sonar/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: 🛠 Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p ./.sonar/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: Cache NuGet packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Authenticate GitHub Packages source
        run: dotnet nuget update source github --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text

      - name: Restore
        run: dotnet restore

      - name: 🔍 Begin ☁️ SonarCloud scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./.sonar/scanner/dotnet-sonarscanner begin \
            /k:"${{ env.SONAR_PROJECT_KEY }}" \
            /o:"${{ env.SONAR_ORG }}" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.cobertura.reportsPaths="TestResults/**/*.cobertura.xml" \
            /d:sonar.coverage.exclusions="**/Migrations/**" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.qualitygate.timeout=600 \
            /d:sonar.scanner.scanAll=false \
            /d:sonar.scanner.skipJreProvisioning=true

      - name: 🛠 Build
        run: |
          dotnet build \
            --no-restore \
            --configuration Release \
            -p:TreatWarningsAsErrors=true

      - name: 🧪 Test (projects in parallel)
        run: |
          mkdir -p TestResults

          find . -name '*.Tests*.csproj' \( ! -name '*.TestsIntegration.csproj' -o -name 'AStarDev.CloudSync.*.TestsIntegration.csproj' \) ! -name 'AStarDev.CloudSync.TestsUnit.csproj' -print0 \
            | xargs -0 -n 1 -P 4 .github/scripts/run-test-project.sh

      - name: 🧪 Test (headless UI project on its own)
        run: |
          find . -name 'AStarDev.CloudSync.TestsUnit.csproj' -print0 \
            | xargs -0 -n 1 .github/scripts/run-test-project.sh

      - name: 🏁 End ☁️ SonarCloud scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./.sonar/scanner/dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
