name: .NET CI

on:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'apps/**/*.cs'
      - 'apps/**/*.csproj'
      - 'apps/**/*.axaml'
      - 'apps/**/*.razor'
      - 'packages/**/*.cs'
      - 'packages/**/*.csproj'
      - 'tests/**/*.cs'
      - 'tests/**/*.csproj'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'global.json'
      - 'NuGet.Config'
      - '*.slnx'
      - '.github/workflows/dotnet-ci.yml'

  # No paths filter: "Build & test" is a required check, and a required check
  # that a filter skips never reports, which blocks the PR forever.
  # The `changes` job skips the build via a job-level `if` instead: a job
  # skipped that way reports as skipped, which satisfies the required check.
  pull_request:
    branches:
      - main
      - 'release/**'

  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: read

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip
  NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NUGET_ENABLE_ENHANCED_HTTP_RETRY: true
  NUGET_ENHANCED_MAX_NETWORK_TRY_COUNT: 6
  NUGET_ENHANCED_NETWORK_TRY_TIMEOUT_MILLISECONDS: 30000

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Keep this pattern in step with the push `paths:` list above.
      # Non-PR events always build (the push trigger is already path-filtered).
      - name: Filter changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          PATTERN='^(apps|packages|tests)/.*\.(cs|csproj|axaml|razor)$|^(Directory\.Build\.props|Directory\.Build\.targets|Directory\.Packages\.props|global\.json|NuGet\.Config)$|^[^/]*\.slnx$|^\.github/workflows/dotnet-ci\.yml$|^\.github/scripts/'
          if [ "$EVENT_NAME" != "pull_request" ] || git diff --name-only "$BASE_SHA" HEAD | grep -Eq "$PATTERN"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
            echo "No code changes - skipping build and test"
          fi

  build-and-test:
    name: Build & test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Authenticate GitHub Packages source
        run: dotnet nuget update source github --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text

      - name: Restore
        run: dotnet restore

      - name: Build
        run: |
          dotnet build \
            --no-restore \
            --configuration Release \
            -p:TreatWarningsAsErrors=true

      - name: Test (projects in parallel)
        run: |
          mkdir -p TestResults

          find . -name '*.Tests*.csproj' ! -name '*.TestsIntegration.csproj' ! -name 'AStarDev.CloudSync.TestsUnit.csproj' -print0 \
            | TEST_RUNNER="xvfb-run -a" xargs -0 -n 1 -P 4 .github/scripts/run-test-project.sh

      - name: Test (headless UI project on its own)
        run: |
          find . -name 'AStarDev.CloudSync.TestsUnit.csproj' -print0 \
            | TEST_RUNNER="xvfb-run -a" xargs -0 -n 1 .github/scripts/run-test-project.sh

      - name: Upload snapshot diffs
        uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: snapshot-diffs
          path: artifacts/snapshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2.24.0
        if: always()
        with:
          files: TestResults/**/*.trx
          check_name: Test results
          fail_on: test failures
      - name: Upload coverage
        uses: codecov/codecov-action@v7.0.0
        if: always()
        with:
          files: TestResults/**/*.cobertura.xml
          fail_ci_if_error: false
