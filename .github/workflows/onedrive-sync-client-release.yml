# Tag format: onedrive-sync-v1.2.3  (or onedrive-sync-v1.2.3-beta.1 for a pre-release)
# All packaging logic lives in desktop-app-release.yml.

name: OneDrive Sync Client Release

on:
  push:
    tags:
      - "onedrive-sync-v[0-9]+.[0-9]+.[0-9]+"
      - "onedrive-sync-v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

concurrency:
  group: onedrive-sync-client-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: ./.github/workflows/desktop-app-release.yml
    secrets: inherit
    with:
      display_name: OneDrive Sync Client
      pack_id: AStarDev.OneDriveSyncClient
      pack_title: AStar Dev OneDrive Sync Client
      main_exe: AStarDev.OneDriveSyncClient
      project_path: apps/desktop/AStarDev.OneDriveSyncClient/AStarDev.OneDriveSyncClient.csproj
      test_project_path: apps/desktop/AStarDev.OneDriveSyncClient.TestsUnit/AStarDev.OneDriveSyncClient.TestsUnit.csproj
      tag_prefix: onedrive-sync-v
      channel_prefix: onedrive-sync
