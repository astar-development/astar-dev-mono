# Tag format: clock-v1.2.3  (or clock-v1.2.3-beta.1 for a pre-release)
# All packaging logic lives in desktop-app-release.yml.

name: Clock Release

on:
  push:
    tags:
      - "clock-v[0-9]+.[0-9]+.[0-9]+"
      - "clock-v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

concurrency:
  group: clock-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: ./.github/workflows/desktop-app-release.yml
    secrets: inherit
    with:
      display_name: Clock
      pack_id: AStarDev.Clock
      pack_title: AStar Dev Clock
      main_exe: AStarDev.Clock
      project_path: apps/desktop/AStarDev.Clock/AStarDev.Clock/AStarDev.Clock.csproj
      test_project_path: apps/desktop/AStarDev.Clock/AStarDev.Clock.TestsUnit/AStarDev.Clock.TestsUnit.csproj
      tag_prefix: clock-v
      channel_prefix: clock
