# ════════════════════════════════════════════════════════════════════════════
# astar-dev-ci.yml
# DISABLED: the astar-dev Astro site is being replaced by AStarDev.Web (Blazor,
# .NET 10) — see astar-dev-web-ci.yml. This workflow is kept for manual runs
# only (workflow_dispatch) until the Astro site is fully retired. Do not
# re-enable push/PR triggers.
#
# Triggers on any push or PR that touches the astar-dev Astro site or this
# workflow. Installs dependencies and builds the site.
# A successful run on main triggers astar-dev-deploy.yml
# ════════════════════════════════════════════════════════════════════════════

name: AStar.Dev CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astar-dev-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.x'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  ci:
    name: Build & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web/astar-dev

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/astar-dev/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
