# Tag format: file-app-v1.2.3  (or file-app-v1.2.3-beta.1 for a pre-release)
# All packaging logic lives in desktop-app-release.yml.

name: File App Release

on:
  push:
    tags:
      - "file-app-v[0-9]+.[0-9]+.[0-9]+"
      - "file-app-v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

concurrency:
  group: file-app-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: ./.github/workflows/desktop-app-release.yml
    secrets: inherit
    with:
      display_name: File App
      pack_id: AStarDev.FileApp
      pack_title: AStar Dev File App
      main_exe: AStarDev.FileApp
      project_path: apps/desktop/AStarDev.FileApp/AStarDev.FileApp/AStarDev.FileApp.csproj
      test_project_path: apps/desktop/AStarDev.FileApp/AStarDev.FileApp.TestsUnit/AStarDev.FileApp.TestsUnit.csproj
      tag_prefix: file-app-v
      channel_prefix: file-app
