# ════════════════════════════════════════════════════════════════════════════
# fab4kids-web-deploy.yml
# Publishes Fab4Kids.Web (Blazor Web App, .NET 10) and deploys it to the
# fab4kids-site Azure Web App.
#
# Fires when "Fab4Kids.Web CI" completes successfully on main (#864 stack
# swap to Linux/.NET 10 is live). Also runnable manually via workflow_dispatch.
# ════════════════════════════════════════════════════════════════════════════

name: Fab4Kids.Web Deploy

on:
  workflow_run:
    workflows: ["Fab4Kids.Web CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fab4kids-web-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip
  NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  AZURE_WEBAPP_NAME: fab4kids-site
  PROJECT_PATH: apps/web/fab4kids-csharp/Fab4Kids.Web/Fab4Kids.Web.csproj

jobs:

  deploy:
    name: Publish & Deploy to Azure
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Authenticate GitHub Packages source
        run: dotnet nuget update source github --username ${{ github.repository_owner }} --password ${{ secrets.GITHUB_TOKEN }} --store-password-in-clear-text

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Publish
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            --no-restore \
            --configuration Release \
            --output ./publish

      - name: Verify publish output
        run: |
          test -f ./publish/Fab4Kids.Web.dll || (echo "ERROR: Fab4Kids.Web.dll not found" && exit 1)

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3.0.8
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_30A7893EAF2D4593B54B7ACFE4926151 }}
          package: ./publish

      - name: Wait for app to warm up
        run: sleep 15

      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://fab-4-kids.co.uk/)
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed with status $STATUS"
            exit 1
          fi
          echo "Health check passed"
