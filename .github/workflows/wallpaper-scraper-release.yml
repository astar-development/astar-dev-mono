# Tag format: wallpaper-scraper-v1.2.3  (or wallpaper-scraper-v1.2.3-beta.1 for a pre-release)
# All packaging logic lives in desktop-app-release.yml.

name: WallpaperScraper Release V2

on:
  push:
    tags:
      - "wallpaper-scraper-v[0-9]+.[0-9]+.[0-9]+"
      - "wallpaper-scraper-v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

concurrency:
  group: wallpaper-scraper-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    uses: ./.github/workflows/desktop-app-release.yml
    secrets: inherit
    with:
      display_name: Wallpaper Scraper
      pack_id: AStarDev.WallpaperScraper
      pack_title: AStar Dev Wallpaper Scraper
      main_exe: AStarDev.WallpaperScraper
      project_path: apps/desktop/Scraper/AStarDev.WallpaperScraper/AStarDev.WallpaperScraper.csproj
      test_project_path: apps/desktop/Scraper/AStarDev.WallpaperScraper.TestsUnit/AStarDev.WallpaperScraper.TestsUnit.csproj
      tag_prefix: wallpaper-scraper-v
      channel_prefix: wallpaper-scraper
      icon_path: apps/desktop/Scraper/AStarDev.WallpaperScraper/Assets/astar.png
      enable_delta_updates: true
