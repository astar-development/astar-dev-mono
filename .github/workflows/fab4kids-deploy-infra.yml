# ════════════════════════════════════════════════════════════════════════════
# Superseded by the Blazor migration (#857). Push trigger disabled so this
# doesn't fire automatically — kept as workflow_dispatch only as a manual
# rollback path until the App Service stack swap (#864) is complete.
# ════════════════════════════════════════════════════════════════════════════

name: Fab4Kids - Deploy Infrastructure

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  deploy-infra:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Azure login
        uses: azure/login@v3.0.0
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2.0.0
        with:
          resourceGroupName: rg-astar-dev
          template: infra/fab4kids/main.bicep
          failOnStdErr: false
